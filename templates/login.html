# Security utilities for SecureShare.
{% extends "base.html" %}
{% block title %}Log In | SecureShare{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="text-uppercase fw-bold small mb-2" style="color:#2856a6;letter-spacing:1.5px">
        Welcome back
    </p>
    <h1 class="h2 fw-bold mb-2">Log in to SecureShare</h1>
    <p class="muted mb-4">Access your secure workspace.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" id="email" name="email" type="email"
                   autocomplete="email" required
                   value="{{ request.form.get('email', '') }}">
        </div>

        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password"
                   type="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>

    <p class="text-center muted mt-4 mb-0">
        New to SecureShare? <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
</section>
{% endblock %}
