
{% extends "base.html" %}
{% block title %}Create Account | SecureShare{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="text-uppercase fw-bold small mb-2" style="color:#2856a6;letter-spacing:1.5px">
        Privacy starts here
    </p>
    <h1 class="h2 fw-bold mb-2">Create your account</h1>
    <p class="muted mb-4">Set up your secure file workspace.</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username"
                   minlength="3" maxlength="30" autocomplete="username"
                   required value="{{ request.form.get('username', '') }}">
        </div>

        <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" id="email" name="email" type="email"
                   autocomplete="email" required
                   value="{{ request.form.get('email', '') }}">
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password"
                   type="password" minlength="12" autocomplete="new-password" required>
            <div class="form-text">Use at least 12 characters.</div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input class="form-control" id="confirm_password" name="confirm_password"
                   type="password" minlength="12" autocomplete="new-password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>

    <p class="text-center muted mt-4 mb-0">
        Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
</section>
{% endblock %}
